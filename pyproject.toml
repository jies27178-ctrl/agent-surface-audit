[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-surface-audit"
version = "0.1.0"
description = "Scan AI agent, skill, plugin, and automation repositories for common security risks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jies27178-ctrl"}]
keywords = ["ai-agent", "security", "cli", "skills", "plugins", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
agent-surface-audit = "agent_surface_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
